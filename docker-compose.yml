services:
  hcm-mock:
    build:
      context: .
      dockerfile: Dockerfile.hcm
    ports:
      - "3001:3001"
    environment:
      HCM_PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/hcm/balances/emp-001/loc-us-pto"]
      interval: 5s
      timeout: 3s
      retries: 5

  microservice:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      HCM_BASE_URL: http://hcm-mock:3001
      HCM_TIMEOUT_MS: 5000
      HCM_RETRY_COUNT: 3
      DATABASE_PATH: /data/timeoff.db
    volumes:
      - db-data:/data
    depends_on:
      hcm-mock:
        condition: service_healthy

volumes:
  db-data:
